<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JKTour24 · हमारे तीर्थ यात्री</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172033;font-family:Arial,'Noto Sans Devanagari',sans-serif}.top{background:#0b203b;color:#ffe19a;padding:16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:white;border:1px solid #e0e5ec;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 5px 16px #0b203b0a}.hidden{display:none!important}.btn{border:0;border-radius:8px;background:#e5bd60;padding:11px 14px;font-weight:bold;cursor:pointer;margin:4px 4px 4px 0}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-weight:bold}.field input{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:8px}.stats,.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat,.mission{border:1px solid #d6b45c;background:#142943;color:#fff1c6;border-radius:12px;padding:14px}.stat{text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:12px}.mission{cursor:pointer}.mission.active{outline:3px solid #e5bd60}.traveler{border:1px solid #d9e0e8;border-radius:11px;padding:13px;margin:10px 0}.muted{color:#667085;font-size:13px}.msg{margin:8px 0;color:#9b4b00}.ok{color:#147d3f}@media(max-width:650px){.stats,.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header class="top"><b>👥 JKTour24 · हमारे तीर्थ यात्री</b><button id="logout" class="btn hidden">लॉगआउट</button></header><main class="wrap">
<section id="loginBox" class="card hidden"><div id="loginMsg" class="msg"></div></section>
<section id="app" class="hidden"><div class="card"><h1>👥 हमारे तीर्थ यात्री</h1><p>यह पेज केवल तीर्थ यात्रियों, मिशन/पड़ाव और सत्यापित दर्शन के लिए है।</p><button class="btn" id="refresh">↻ रिफ्रेश</button><button class="btn" id="all">सभी यात्री</button><div id="msg" class="msg"></div><div id="stats" class="stats"></div></div><div class="card"><h2>🛕 मिशन / पड़ाव</h2><div id="missions" class="cards"></div></div><div class="card"><h2 id="listTitle">सभी पंजीकृत यात्री</h2><div class="field"><label>यात्री खोजें</label><input id="search" placeholder="नाम, मोबाइल या Yatra ID"></div><div id="users"></div></div></section></main>
<script>
const URL="https://whpsbuubyszcqtzwwinb.supabase.co",KEY="sb_publishable_hzgQGEVIMU5YKB1WXQaY5w_bsAgcm8S",API=URL+"/functions/v1/jktour24-bookings",sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data={users:[],visits:[],missions:[],mandirs:[]},filter="";
function msg(t,ok=false){$("msg").textContent=t;$("msg").className="msg"+(ok?" ok":"")}
async function api(body){const {data:{session}}=await sb.auth.getSession();const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,...session?{Authorization:"Bearer "+session.access_token}:{}},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error||"डेटा लोड नहीं हुआ");return j}
async function enter(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace("admin-bookings.html?return=teerth-yatri-admin.html");return}const {data:{user}}=await sb.auth.getUser();if(!user||user.app_metadata?.role!=="admin")throw Error("इस खाते को Admin अनुमति नहीं है।");$("loginBox").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");await load()}
async function load(){try{msg("डेटा लोड हो रहा है…");data=await api({action:"admin_passport_dashboard"});data.users=data.users||[];data.visits=data.visits||[];data.missions=(data.missions||[]).filter(x=>x.active!==false);data.mandirs=data.mandirs||[];render();msg("डेटा अपडेट हो गया।",true)}catch(e){msg(e.message)}}
const norm=s=>String(s||"").normalize("NFKC").trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"-");
function done(u,m){return data.visits.filter(v=>v.user_id===u&&v.mission_key===m&&v.verified)}
function render(){const uniq=new Set(data.visits.filter(v=>v.verified).map(v=>norm(v.temple_name||v.temple_key)));const completed=data.users.reduce((n,u)=>n+data.missions.filter(m=>{const ts=data.mandirs.filter(t=>t.active!==false&&t.mission_key===m.mission_key);return ts.length&&ts.every(t=>done(u.id,m.mission_key).some(v=>norm(v.temple_name)===norm(t.temple_name)||norm(v.temple_key)===norm(t.temple_name)))}).length,0);$("stats").innerHTML=[[data.users.length,"कुल पंजीकृत यात्री"],[data.missions.length,"कुल मिशन / पड़ाव"],[completed,"पूरे मिशन (यात्री-वार)"],[uniq.size,"सत्यापित अलग मंदिर"]].map(x=>'<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("");$("missions").innerHTML=data.missions.map(m=>{const ts=data.mandirs.filter(t=>t.active!==false&&t.mission_key===m.mission_key),ids=new Set(data.visits.filter(v=>v.mission_key===m.mission_key).map(v=>v.user_id)),fin=data.users.filter(u=>ts.length&&ts.every(t=>done(u.id,m.mission_key).some(v=>norm(v.temple_name)===norm(t.temple_name)||norm(v.temple_key)===norm(t.temple_name)))).length;return '<div class="mission '+(filter===m.mission_key?'active':'')+'" data-m="'+esc(m.mission_key)+'"><h3>'+esc(m.icon||"🛕")+' '+esc(m.mission_title)+'</h3><p>'+ids.size+' यात्री</p><p>'+fin+' ने पूरा किया</p><p>'+ts.length+' मंदिर</p></div>'}).join("")||"<p>अभी कोई सक्रिय मिशन नहीं है।</p>";document.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{filter=filter===el.dataset.m?"":el.dataset.m;$("listTitle").textContent=filter?(data.missions.find(m=>m.mission_key===filter)?.mission_title||"मिशन")+" के यात्री":"सभी पंजीकृत यात्री";render()});let us=data.users.filter(u=>!filter||data.visits.some(v=>v.user_id===u.id&&v.mission_key===filter));const q=$("search").value.toLowerCase();us=us.filter(u=>[u.full_name,u.mobile,u.yatra_id].some(v=>String(v||"").toLowerCase().includes(q)));$("users").innerHTML=us.map(u=>{const unique=new Set(data.visits.filter(v=>v.user_id===u.id&&v.verified).map(v=>norm(v.temple_name||v.temple_key))).size;const ms=data.missions.filter(m=>!filter||m.mission_key===filter).map(m=>{const ts=data.mandirs.filter(t=>t.active!==false&&t.mission_key===m.mission_key),n=ts.filter(t=>done(u.id,m.mission_key).some(v=>norm(v.temple_name)===norm(t.temple_name)||norm(v.temple_key)===norm(t.temple_name))).length;return '<p class="muted">'+esc(m.mission_title)+': '+n+'/'+ts.length+' मंदिर</p>'}).join("");return '<div class="traveler"><h3>'+esc(u.full_name)+'</h3><p>Yatra ID: <b>'+esc(u.yatra_id)+'</b> · मोबाइल: '+esc(u.mobile||"दर्ज नहीं")+'</p><p>अलग मंदिर पूरे: <b>'+unique+'/100</b></p>'+ms+'</div>'}).join("")||"<p>इस सूची में कोई यात्री नहीं मिला। सभी यात्रियों के लिए फ़िल्टर हटाएँ।</p>"}
$("logout").onclick=async()=>{location.href="admin-bookings.html"};$("refresh").onclick=load;$("all").onclick=()=>{filter="";$("listTitle").textContent="सभी पंजीकृत यात्री";render()};$("search").oninput=render;sb.auth.getSession().then(({data:s})=>{if(s.session)enter().catch(e=>$("loginMsg").textContent=e.message);else{location.replace("admin-bookings.html?return=teerth-yatri-admin.html");}});
</script></body></html>
