<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JKTour24 Tour Management Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font:15px Arial,sans-serif}.top{background:#071a35;color:#fff;padding:16px 5%;border-bottom:3px solid #e7b957}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:white;border:1px solid #e1e7ef;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5e1;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;background:#e7b957;padding:11px 14px;font-weight:bold;cursor:pointer;margin:4px}.msg{font-size:13px;color:#9a3412;white-space:pre-wrap}.hidden{display:none!important}.item{border:1px solid #e1e7ef;padding:12px;border-radius:9px;margin:8px 0}.tabs{display:flex;flex-wrap:wrap;gap:6px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><header class="top"><b>🚌 JKTOUR24 · TOUR MANAGEMENT</b></header><main class="wrap">
<section class="card"><h1>Admin Login</h1><p>Existing authorized JKTour24 Admin account se login karein.</p><form id="login" class="grid"><div><label>Email</label><input id="email" type="email" required></div><div><label>Password</label><input id="password" type="password" required></div><div><button class="btn">Login</button><button id="logout" class="btn hidden" type="button">Logout</button></div></form><div id="msg" class="msg"></div></section>
<section id="dash" class="hidden"><div class="tabs"><button class="btn" data-show="managers">Tour Manager Banayein</button><button class="btn" data-show="tours">Tour Banayein / Assign Karein</button><button class="btn" data-show="stops">Route Stop Add Karein</button></div>
<section class="card" id="managers"><h2>New Tour Manager Login</h2><form id="mf" class="grid"><div><label>Manager Name</label><input id="mn" required></div><div><label>Mobile</label><input id="mm"></div><div><label>Login Email</label><input id="me" type="email" required></div><div><label>Temporary Password (10+ characters)</label><input id="mp" type="password" minlength="10" required></div><div><button class="btn">Create Manager</button></div></form><div id="mmg" class="msg"></div><h3>Existing Managers</h3><div id="ml"></div></section>
<section class="card hidden" id="tours"><h2>Create Tour & Assign Manager</h2><form id="jf" class="grid"><div><label>Tour Name</label><input id="jt" required placeholder="Delhi to 9 Devi Yatra"></div><div><label>Exact Package Slug</label><input id="js" required placeholder="9-devi"></div><div><label>Travel Date</label><input id="jd" type="date" required></div><div><label>Bus Number</label><input id="jb"></div><div><label>Tour Manager</label><select id="jman" required></select></div><div><label>Pickup Points (comma separated)</label><input id="jp" placeholder="Delhi, Janakpuri, Gurgaon"></div><div style="grid-column:1/-1"><label>Welcome Message</label><textarea id="jw" rows="2"></textarea></div><div style="grid-column:1/-1"><label>Packing list (one item per line)</label><textarea id="jpack" rows="3">Valid ID / Aadhaar Card
Booking Ticket
Mobile and Charger
Power Bank
Zaroori Dawaaiyan
Paani ki Bottle</textarea></div><div><button class="btn">Save & Assign</button></div></form><div id="jmsg" class="msg"></div><h3>Existing Tours</h3><div id="jl"></div></section>
<section class="card hidden" id="stops"><h2>Route Stop Add Karein</h2><form id="sf" class="grid"><div><label>Tour</label><select id="sj" required></select></div><div><label>Stop Name</label><input id="sn" required placeholder="Mansa Devi / Sharma Dhaba"></div><div><label>Stop Type</label><select id="st"><option value="temple">Mandir / Darshan</option><option value="tea_break">Chai / Paani Break</option><option value="restaurant">Dhaba / Restaurant</option><option value="fuel">Petrol Pump</option><option value="other">Other</option></select></div><div><label>Stop Order</label><input id="so" type="number" min="1" value="1"></div><div><label>Address</label><input id="sa"></div><div><label>Expected Stop Minutes</label><input id="sm" type="number" min="0" value="30"></div><div><label>Latitude</label><input id="slat" type="number" step="any"></div><div><label>Longitude</label><input id="slng" type="number" step="any"></div><div style="grid-column:1/-1"><label>Passenger Message</label><textarea id="smsg" rows="2"></textarea></div><div><button class="btn">Add Stop</button></div></form><div id="stopmsg" class="msg"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U="https://whpsbuubyszcqtzwwinb.supabase.co",K="sb_publishable_hzgQGEVIMU5YKB1WXQaY5w_bsAgcm8S",API=U+"/functions/v1/jktour24-bookings",sb=supabase.createClient(U,K),$=x=>document.getElementById(x),esc=x=>String(x??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let managers=[],tours=[];async function call(body){let{data:{session}}=await sb.auth.getSession();if(!session)throw Error("Admin login required");let r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":K,Authorization:"Bearer "+session.access_token},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
async function boot(){let{data:{user}}=await sb.auth.getUser();if(!user||user.app_metadata?.role!=="admin"){await sb.auth.signOut();throw Error("Yeh authorized Admin account nahi hai.")} $("dash").classList.remove("hidden");$("logout").classList.remove("hidden");await Promise.all([loadManagers(),loadTours()])}
async function loadManagers(){let r=await call({action:"admin_list_tour_managers"});managers=r.managers||[];$("ml").innerHTML=managers.map(m=>'<div class="item"><b>'+esc(m.full_name)+'</b><br>'+esc(m.email)+' · '+esc(m.mobile||"")+'</div>').join("")||"Abhi koi manager nahi.";$("jman").innerHTML='<option value="">Manager select karein</option>'+managers.filter(m=>m.active).map(m=>'<option value="'+m.user_id+'">'+esc(m.full_name)+' · '+esc(m.email)+'</option>').join("")}
async function loadTours(){let r=await call({action:"admin_list_journeys"});tours=r.journeys||[];$("jl").innerHTML=tours.map(t=>'<div class="item"><b>'+esc(t.title)+'</b><br>'+esc(t.travel_date||"Date TBD")+' · '+esc(t.bus_label||"Bus not set")+'<br>Manager: '+esc(t.tour_managers?.full_name||"Not assigned")+' · Stops: '+(t.tour_journey_stops||[]).length+'</div>').join("")||"Abhi tour nahi bana.";$("sj").innerHTML='<option value="">Tour select karein</option>'+tours.map(t=>'<option value="'+t.id+'">'+esc(t.title)+' · '+esc(t.travel_date||"")+'</option>').join("")}
$("login").onsubmit=async e=>{e.preventDefault();$("msg").textContent="Login ho raha hai…";let{error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("msg").textContent=error.message;return}try{await boot();$("msg").textContent="Login successful"}catch(e){$("msg").textContent=e.message}};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("mf").onsubmit=async e=>{e.preventDefault();try{let r=await call({action:"admin_create_tour_manager",full_name:$("mn").value,mobile:$("mm").value,email:$("me").value,password:$("mp").value});$("mmg").textContent="Login ban gaya: "+r.manager.email+" — ab Tour Manager Panel mein isi email/password se login karein.";e.target.reset();await loadManagers()}catch(e){$("mmg").textContent=e.message}};
$("jf").onsubmit=async e=>{e.preventDefault();try{let r=await call({action:"admin_save_journey",journey:{title:$("jt").value,package_slug:$("js").value,travel_date:$("jd").value,bus_label:$("jb").value,manager_user_id:$("jman").value,pickup_points:$("jp").value.split(",").map(x=>x.trim()).filter(Boolean),welcome_message:$("jw").value,packing_list:$("jpack").value.split("\n").map(x=>x.trim()).filter(Boolean)}});$("jmsg").textContent="Tour save aur manager assign ho gaya. ID: "+r.journey.id;e.target.reset();await loadTours()}catch(e){$("jmsg").textContent=e.message}};
$("sf").onsubmit=async e=>{e.preventDefault();try{await call({action:"admin_save_route_stop",stop:{journey_id:$("sj").value,stop_name:$("sn").value,stop_type:$("st").value,stop_order:$("so").value,address:$("sa").value,expected_minutes:$("sm").value,latitude:$("slat").value,longitude:$("slng").value,public_message:$("smsg").value}});$("stopmsg").textContent="Route stop add ho gaya.";e.target.reset();await loadTours()}catch(e){$("stopmsg").textContent=e.message}};
document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>["managers","tours","stops"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.show)));
sb.auth.getSession().then(async({data})=>{if(data.session)try{await boot()}catch(e){$("msg").textContent=e.message}});
</script></body></html>
