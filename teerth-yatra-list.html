<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JKTour24 · तीर्थ सूची</title>
<style>
:root{--navy:#0a1e39;--gold:#f1cf78;--line:#40536c;--cream:#fff8e8}*{box-sizing:border-box}body{margin:0;background:#f3f0e7;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#eef3fa}.wrap{max-width:760px;margin:18px auto;padding:16px}.card{background:linear-gradient(150deg,#142943,#071a35);border:1px solid #d8b65b;border-radius:22px;padding:20px;box-shadow:0 10px 28px #0002}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #46536a;padding-bottom:14px;margin-bottom:16px}.brand{font-weight:900;letter-spacing:1px;color:var(--gold)}.sub{color:#cbd5e1;font-size:13px;margin-top:5px}.seal{font-size:30px;border:2px solid var(--gold);border-radius:50%;padding:9px}.title{font-size:25px;color:var(--gold);font-weight:900;margin:12px 0}.hint{color:#cbd5e1;line-height:1.7}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{border:1px solid var(--gold);border-radius:30px;padding:7px 12px;color:var(--gold);font-size:13px}.search{width:100%;padding:13px;border:1px solid var(--gold);border-radius:10px;font-size:16px;margin:12px 0}.row{padding:13px 0;border-bottom:1px solid var(--line);line-height:1.6}.row strong{color:#fff1c6}.small{font-size:13px;color:#d6c28e}.ok{color:#9ce5ad;font-weight:900}.pending{color:#cbd5e1}.back{display:inline-block;color:#15243b;background:var(--gold);padding:10px 15px;border-radius:10px;text-decoration:none;font-weight:800;margin-bottom:14px}.filter{padding:11px;width:100%;border-radius:9px;margin:8px 0;font-size:15px}.empty{padding:18px;border:1px dashed #74839a;border-radius:12px;color:#d7deea}@media(max-width:480px){.wrap{padding:9px}.card{padding:15px}.title{font-size:22px}}
</style></head><body><main class="wrap"><a class="back" id="backLink" href="teerth-yatra-card.html">← Master Card पर वापस</a><div class="card"><div class="top"><div><div class="brand">JKTOUR24 · SUPER TEERTH</div><div class="sub" id="traveler">यात्री की सूची</div></div><div class="seal">🛕</div></div><div class="title" id="pageTitle">तीर्थ सूची</div><p class="hint" id="pageHint">आपके सत्यापित दर्शन के आधार पर सूची दिखाई जाएगी।</p><div class="stats"><span class="pill" id="progress">लोड हो रहा है…</span><span class="pill" id="verifiedVisits">सत्यापित दर्शन: 0</span></div><input class="search" id="search" type="search" placeholder="नाम या स्थान खोजें…"><select class="filter" id="missionFilter" style="display:none"><option value="">सभी मिशन</option></select><div id="list" class="hint">सूची लोड हो रही है…</div></div></main>
<script>
const API='https://whpsbuubyszcqtzwwinb.supabase.co/functions/v1/jktour24-bookings',KEY='sb_publishable_hzgQGEVIMU5YKB1WXQaY5w_bsAgcm8S';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),view=params.get('view')||'temples',yatraId=params.get('id')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFKC').trim().toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');
let data={user:{},visits:[],missions:[],mandirs:[]},currentRows=[];
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,...extra})});const d=await r.json().catch(()=>({error:'सर्वर से जवाब नहीं मिला'}));if(!r.ok)throw Error(d.error||'सूची लोड नहीं हुई');return d}
function visitCounts(){const map=new Map();(data.visits||[]).forEach(v=>{const k=norm(v.temple_key||v.temple_name);if(k)map.set(k,(map.get(k)||0)+1);const name=norm(v.temple_name);if(name&&name!==k)map.set(name,(map.get(name)||0)+1)});return map}
function uniqueTemples(){const map=new Map();data.mandirs.filter(t=>t.active!==false&&t.temple_name).forEach(t=>{const k=norm(t.temple_name);if(!map.has(k))map.set(k,t)});return [...map.values()].sort((a,b)=>a.temple_name.localeCompare(b.temple_name,'hi'))}
function missionDone(m){const list=data.mandirs.filter(t=>t.active!==false&&t.mission_key===m.mission_key);const counts=visitCounts();return list.length>0&&list.every(t=>(counts.get(norm(t.temple_name))||0)>0)}
function render(){const q=$('search').value.trim().toLocaleLowerCase();const counts=visitCounts();let rows=[];
if(view==='temples'){const all=uniqueTemples();rows=all.filter(t=>(t.temple_name+' '+(t.location||'')+' '+(data.missions.find(m=>m.mission_key===t.mission_key)?.mission_title||t.mission_title||'')).toLocaleLowerCase().includes(q));$('pageTitle').textContent='🛕 100 मंदिर · मिशन और पड़ाव के अनुसार';$('pageHint').textContent='हर मिशन/पड़ाव खोलकर उसके मंदिर देखें। हर मंदिर के सामने दर्शन की संख्या और सत्यापन का निशान रहेगा। एक मंदिर कुल गिनती में एक ही बार गिना जाएगा।';$('progress').textContent=all.filter(t=>(counts.get(norm(t.temple_name))||0)>0).length+'/100 अलग मंदिर पूरे';$('missionFilter').style.display='none';const groups=new Map();rows.forEach(t=>{const k=t.mission_key||'unassigned';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)});const padavRules=[{title:'9 देवी यात्रा',rank:1,match:/9 देवी|नौ देवी|देवी.*शिवखोड़ी|devi/i},{title:'खाटू श्याम यात्रा',rank:2,match:/खाटू|khatu/i},{title:'मथुरा-वृंदावन यात्रा',rank:3,match:/मथुरा|वृंदावन|ब्रज|braj/i},{title:'उज्जैन-ओंकारेश्वर यात्रा',rank:4,match:/उज्जैन|ujjain|ओंकारेश्वर/i},{title:'कैंची धाम यात्रा',rank:5,match:/कैंची|kainchi/i},{title:'अयोध्या-काशी यात्रा',rank:6,match:/अयोध्या|काशी|वाराणसी|ayodhya|kashi/i}];const ordered=[...data.missions.filter(m=>groups.has(m.mission_key)).map(m=>({...m,_rule:padavRules.find(r=>r.match.test((m.mission_title||'')+' '+m.mission_key))})),...([...groups.keys()].filter(k=>!data.missions.some(m=>m.mission_key===k)).map(k=>({mission_key:k,mission_title:rows.find(t=>(t.mission_key||'unassigned')===k)?.mission_title||'अन्य तीर्थ स्थल'})))].sort((a,b)=>(a._rule?.rank||99)-(b._rule?.rank||99)||String(a.mission_title).localeCompare(String(b.mission_title),'hi'));$('list').innerHTML=rows.length?ordered.map((m,idx)=>{const ts=(groups.get(m.mission_key)||[]).sort((a,b)=>(Number(a.sort_order)||1)-(Number(b.sort_order)||1));const done=ts.filter(t=>(counts.get(norm(t.temple_name))||0)>0).length;const label=m._rule?.title||m.mission_title||'अन्य तीर्थ स्थल';return '<details class="row"><summary style="cursor:pointer"><strong>🧭 पड़ाव '+(m._rule?.rank||idx+1)+': '+esc(label)+'</strong><div class="small">'+done+'/'+ts.length+' मंदिर पूरे · '+ts.length+' मंदिर</div></summary><div style="padding:6px 0">'+ts.map(t=>{const n=counts.get(norm(t.temple_name))||0;return '<div class="row"><strong>'+(n?'✅':'◯')+' '+esc(t.temple_name)+'</strong><div>'+esc(t.location||'स्थान दर्ज नहीं')+'</div><div class="'+(n?'ok':'pending')+'">दर्शन: '+n+' बार</div></div>'}).join('')+'</div></details>'}).join(''):'<div class="empty">इस खोज से कोई मंदिर नहीं मिला।</div>'}
else if(view==='missions'){rows=data.missions.filter(m=>m.active!==false&&(m.mission_title||'').toLocaleLowerCase().includes(q));$('pageTitle').textContent='🙏 सभी तीर्थ मिशन';$('pageHint').textContent='हर मिशन खोलकर उसके मंदिर, दर्शन की प्रगति और मिशन पूरा हुआ है या नहीं देख सकते हैं।';$('progress').textContent=data.missions.filter(m=>m.active!==false&&missionDone(m)).length+'/'+data.missions.filter(m=>m.active!==false).length+' मिशन पूरे';$('missionFilter').style.display='none';$('list').innerHTML=rows.length?rows.map(m=>{const ts=data.mandirs.filter(t=>t.active!==false&&t.mission_key===m.mission_key).sort((a,b)=>(Number(a.sort_order)||1)-(Number(b.sort_order)||1));const done=missionDone(m);return '<details class="row"><summary><strong>'+(done?'✅':'◯')+' '+esc(m.icon||'🛕')+' '+esc(m.mission_title)+'</strong><div class="small">'+ts.filter(t=>(counts.get(norm(t.temple_name))||0)>0).length+'/'+ts.length+' मंदिरों के दर्शन</div></summary><div style="padding:8px 0">'+(ts.length?ts.map((t,i)=>{const n=counts.get(norm(t.temple_name))||0;return '<div class="row">'+(n?'✅':'◯')+' '+(i+1)+'. '+esc(t.temple_name)+'<div class="small">'+esc(t.location||'')+'</div><div class="'+(n?'ok':'pending')+'">दर्शन: '+n+' बार</div></div>'}).join(''):'<div class="empty">इस मिशन में अभी मंदिर नहीं जोड़े गए।</div>')+'</div></details>'}).join(''):'<div class="empty">कोई मिशन नहीं मिला।</div>'}
else{rows=data.missions.filter(m=>m.active!==false);$('pageTitle').textContent='🧭 मिशन के पड़ाव';$('pageHint').textContent='हर मिशन को एक पड़ाव/यात्रा समूह माना गया है। हर मंदिर को अलग-अलग नया पड़ाव नहीं बनाया गया है। अपने मिशन का नाम चुनकर उसके तय मंदिरों की क्रमबद्ध सूची देखें।';$('progress').textContent=rows.filter(m=>missionDone(m)).length+'/'+rows.length+' मिशन-पड़ाव पूरे';$('missionFilter').style.display='block';$('missionFilter').innerHTML='<option value="">सभी मिशन / पड़ाव</option>'+rows.map(m=>'<option value="'+esc(m.mission_key)+'">'+esc(m.mission_title)+'</option>').join('');const key=$('missionFilter').value;rows=rows.filter(m=>!key||m.mission_key===key).filter(m=>(m.mission_title||'').toLocaleLowerCase().includes(q)||data.mandirs.some(t=>t.mission_key===m.mission_key&&(t.temple_name||'').toLocaleLowerCase().includes(q)));$('list').innerHTML=rows.length?rows.map(m=>{const ts=data.mandirs.filter(t=>t.active!==false&&t.mission_key===m.mission_key).sort((a,b)=>(Number(a.sort_order)||1)-(Number(b.sort_order)||1));const done=missionDone(m);return '<details class="row"><summary><strong>'+(done?'✅':'◯')+' पड़ाव: '+esc(m.mission_title)+'</strong><div class="small">'+ts.filter(t=>(counts.get(norm(t.temple_name))||0)>0).length+'/'+ts.length+' दर्शन स्थल पूरे</div></summary><div style="padding:8px 0">'+(ts.length?ts.map((t,i)=>{const n=counts.get(norm(t.temple_name))||0;return '<div class="row">पड़ाव स्थल '+(i+1)+': '+(n?'✅':'◯')+' '+esc(t.temple_name)+'<div class="small">'+esc(t.location||'')+'</div><div class="'+(n?'ok':'pending')+'">दर्शन: '+n+' बार</div></div>'}).join(''):'<div class="empty">इस मिशन के मंदिर/पड़ाव अभी जोड़े नहीं गए हैं।</div>')+'</div></details>'}).join(''):'<div class="empty">कोई मिशन/पड़ाव नहीं मिला।</div>'}
$('verifiedVisits').textContent='सत्यापित दर्शन: '+data.visits.length}
$('search').addEventListener('input',render);$('missionFilter').addEventListener('change',render);
async function init(){try{if(!/^JKT-YT-[A-F0-9]{8}$/.test(yatraId))throw Error('Yatra ID नहीं मिला। Master Card से दोबारा खोलें।');const d=await api('passport_public_profile',{yatra_id:yatraId});data={user:d.user||{},visits:d.visits||[],missions:d.missions||[],mandirs:d.mandirs||[]};$('traveler').textContent=(data.user.full_name||'यात्री')+' · '+yatraId;$('backLink').href='teerth-yatra-card.html';render()}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
init();
</script></body></html>
